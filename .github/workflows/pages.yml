# Temporary test site while Netlify is paused: publishes public/ to GitHub Pages at
# https://kantorhorvathambrus-source.github.io/ConcenTraining/ on every push to main.
# Can also be started by hand: Actions tab → "Deploy to GitHub Pages" → Run workflow.
# No build step: public/ is uploaded exactly as it is. The Netlify Functions (/api/*) don't run
# on Pages, so popularity stats don't work there (see "GitHub Pages test site" in the README).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what publishing to Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a deploy that is still running, so the latest main always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
