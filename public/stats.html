<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Light / dark (see "Light and dark" in the README): sets the theme on <html> before anything is
       drawn, so the page never shows in the wrong theme first. -->
  <script src="js/theme.js"></script>
  <title>Character Stats · ConcenTraining</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
  <!-- The two font files every page needs, fetched right away (not only once the stylesheet has
       been read), so the text shows in a system font for a shorter moment. -->
  <link rel="preload" href="fonts/figtree/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Home Screen / install support. Colors: the page background (--color-bg) of the light and the dark
       theme in css/style.css. js/theme.js gives both the colour of the theme that is showing. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f5ede0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12172b" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="ConcenTraining">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Character stats</h1>
      <p class="muted">How many sessions were started with each character.</p>
      <p class="muted">Counts start from the switch to the new storage in November 2026.</p>
    </header>

    <p id="storeNote" class="muted" hidden></p>

    <p id="statsStatus" class="muted">Loading…</p>

    <table id="statsTable" class="stats-table" hidden>
      <thead>
        <tr>
          <th scope="col">Character</th>
          <th scope="col" id="recentHeader">Last 30 days</th>
          <th scope="col">All time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p id="paidNote" class="muted"></p>

    <!-- Every character users made themselves, counted together (never by their own names). -->
    <table id="customTable" class="stats-table" hidden>
      <thead>
        <tr>
          <th scope="col">Custom characters (always paid)</th>
          <th scope="col" id="customRecentHeader">Last 30 days</th>
          <th scope="col">All time</th>
        </tr>
      </thead>
      <tbody><tr><td>All custom characters</td><td id="customRecent"></td><td id="customTotal"></td></tr></tbody>
    </table>
    <p><a href="./" class="back-link">← Back to the timer</a></p>
  </main>

  <!-- Only for CUSTOM_CHARACTERS_ON: the custom line is left out while custom characters are off. -->
  <script src="js/custom-characters.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
