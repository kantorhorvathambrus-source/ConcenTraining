<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ConcenTraining app icon: a cream crosshair (cream-100) with an amber brain (amber-300) in
       the middle, on espresso (espresso-900). The brain is filled and seen from above: four
       rounded lobes per hemisphere, notches at the front and back, a central fissure and two
       short folds per side, all in espresso; the right hemisphere mirrors the left. Source for
       the PNGs in this folder; favicon.ico comes from icon-small.svg. See the README section
       "iPhone storage and the Home Screen app" (Icons). -->
  <rect width="512" height="512" fill="#2b2118"/>
  <!-- brain, scaled up 10% around the centre so it reads at 48 px. It is drawn
       before the crosshair: the espresso outline slips under the ring, and the amber fill keeps
       clear space to it. -->
  <g transform="translate(256 256) scale(1.1) translate(-256 -256)" stroke="#2b2118" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <g fill="#ffb454">
      <path d="M256 170A48.9 48.9 0 0 0 169.8 183.7A49.3 49.3 0 0 0 140.3 263.5A47.6 47.6 0 0 0 178.4 336.3A43.6 43.6 0 0 0 256 342Z"/>
      <path d="M256 170A48.9 48.9 0 0 0 169.8 183.7A49.3 49.3 0 0 0 140.3 263.5A47.6 47.6 0 0 0 178.4 336.3A43.6 43.6 0 0 0 256 342Z" transform="translate(512 0) scale(-1 1)"/>
    </g>
    <g fill="none">
      <path d="M200 212C216 219 224 233 221 250M174 288C192 285 206 296 208 314"/>
      <path d="M200 212C216 219 224 233 221 250M174 288C192 285 206 296 208 314" transform="translate(512 0) scale(-1 1)"/>
    </g>
  </g>
  <g fill="none" stroke="#f3e9d8" stroke-width="26" stroke-linecap="round">
    <circle cx="256" cy="256" r="164"/>
    <path d="M256 44V104M256 408V468M44 256H104M408 256H468"/>
  </g>
</svg>
